version: 2

models:

  - name: fct_employee_events
    description: Employee lifecycle events

  - name: fct_employee_monthly_archives
    description: Monthly snapshots of employee workforce data
  
  - name: flow_analysis
    description: >
      Monthly snapshot of employee workforce data, capturing key metrics
      such as headcount, hires, and terminations.

  - name: hiring_analysis
    description: >
      Monthly hiring key performance indicators (KPIs) for workforce analytics.
  
  - name: attrition_analysis
    description: >
      Analysis of employee attrition trends, including tenure and exit reasons.
  
  - name: hr_kpi_summary
    description: >
      Summary of key HR metrics, including headcount, turnover, and diversity statistics.

semantic_models:

  - name: employee_events

    model: ref('fct_employee_events')

    defaults:
      agg_time_dimension: event_date

    entities:
      - name: employee
        type: primary
        expr: employee_id

    dimensions:
      - name: event_date
        type: time
        type_params:
          time_granularity: day

      - name: event_type
        type: categorical

      - name: division
        type: categorical

      - name: department_type
        type: categorical

    measures:
      - name: event_count
        agg: count
        expr: 1

  - name: workforce_dynamics

    model: ref('flow_analysis')

    defaults:
      agg_time_dimension: metric_month

    entities:
      - name: workforce_month
        type: primary
        expr: metric_month

    dimensions:
      - name: metric_month
        type: time
        type_params:
          time_granularity: month

    measures:
      - name: hires
        agg: sum

      - name: terminations
        agg: sum

metrics:

  - name: monthly_hires
    label: Monthly Hires
    type: simple
    type_params:
      measure: hires

  - name: monthly_terminations
    label: Monthly Terminations
    type: simple
    type_params:
      measure: terminations